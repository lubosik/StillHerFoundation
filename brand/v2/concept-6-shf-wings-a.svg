<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="t">
  <title id="t">SHF Butterfly A, letters as wings</title>
  <desc>The direct attempt. An S and its mirror splayed as the four wings, an H standing between them as the body, the F read from the H's upper arm. It is beautiful at poster size and it dies below 64px, because a Didone puts its mass in the middle of a stroke and hairlines at the tips.</desc>
