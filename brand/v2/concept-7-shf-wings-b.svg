<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="t">
  <title id="t">SHF Butterfly B, S wing and F wing</title>
  <desc>The literal reading of the idea: S is the left wing, F is the right wing, H is the body. Submitted as a documented failure. An S and an F are not mirror images, so the creature is never symmetrical and never reads as a butterfly.</desc>
