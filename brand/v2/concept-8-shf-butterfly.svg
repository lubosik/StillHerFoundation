  <title id="t">SHF Butterfly, the letters cut into the wings</title>
  <desc>The thyroid butterfly with the S cut clean out of the left wing, the F out of the right, and the H standing as the body and the isthmus with a pearl set at the joint. The monogram lives in the counters, so at icon size the counters close and a butterfly is still there.</desc>
